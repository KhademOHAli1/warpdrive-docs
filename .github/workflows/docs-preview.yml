name: Documentation renderer preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  preview:
    name: Verify and export the static docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the reviewed Warpdrive content pin
        id: content
        shell: bash
        run: |
          repository=$(jq -er '.repository' content-source.json)
          revision=$(jq -er '.revision' content-source.json)
          [[ "$repository" == KhademOHAli1/warpdrive ]]
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          printf 'repository=%s\nrevision=%s\n' "$repository" "$revision" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned Warpdrive content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.content.outputs.repository }}
          ref: ${{ steps.content.outputs.revision }}
          path: .content-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs-site/docs/
            /docs-site/public/img/
            /src/app/globals.css
      - name: Set up package-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Verify and stage public content
        env:
          CONTENT_REVISION: ${{ steps.content.outputs.revision }}
        run: |
          source="$GITHUB_WORKSPACE/.content-source"
          test "$(git -C "$source" rev-parse HEAD)" = "$CONTENT_REVISION"
          bun scripts/stage-content.mjs "$source"
      - name: Install and audit locked dependencies
        run: |
          bun install --frozen-lockfile
          bun --no-env-file audit --json
      - name: Check renderer types
        run: bun run typecheck
      - name: Build and verify the static export
        run: |
          bun run build
          bun run check:export
      - name: Record source revisions for the preview
        env:
          CONTENT_REPOSITORY: ${{ steps.content.outputs.repository }}
          CONTENT_REVISION: ${{ steps.content.outputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(jq -er .revision .staged-content.json)" = "$CONTENT_REVISION"
          jq -n --arg rendererRepository "$GITHUB_REPOSITORY" \
            --arg rendererRevision "$GITHUB_SHA" \
            --arg contentRepository "$CONTENT_REPOSITORY" \
            --arg contentRevision "$CONTENT_REVISION" \
            --arg stagingReceiptSha256 "$(sha256sum .staged-content.json | cut -d ' ' -f 1)" \
            '{rendererRepository:$rendererRepository, rendererRevision:$rendererRevision,
              contentRepository:$contentRepository, contentRevision:$contentRevision,
              stagingReceiptSha256:$stagingReceiptSha256}' > preview-provenance.json
      - name: Upload the verified preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warpdrive-docs-preview-${{ github.sha }}-${{ steps.content.outputs.revision }}
          path: |
            out/
            preview-provenance.json
          if-no-files-found: error
          retention-days: 7
